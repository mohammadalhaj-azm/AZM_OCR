# Client registry: every system allowed to call the API. Copy to config/clients.yaml, edit, and set
# CLIENTS_FILE=config/clients.yaml (then leave API_KEYS, WEBHOOK_SECRET and WEBHOOK_ALLOWED_HOSTS empty).
#
# The file holds NO secrets, so it can be reviewed and versioned like code:
#   - API keys are stored as SHA-256 hashes. `uv run python scripts/client_key.py new` prints a new key (hand it to
#     the client over a secure channel) and the hash to put here.
#   - A client's webhook signing secret lives in the environment variable named by `secret_env`
#     (`uv run python scripts/client_key.py secret` prints a new one).
# The id (the key under `clients:`) owns the client's jobs and appears in the logs: keep it stable.
# Changes take effect on restart. Unknown fields are errors, so a typo can't silently drop a limit.
#
# The hashes below are random placeholders that match no key: replace them.

# Processing profiles: per-entity settings (app/profiles.py lists them all). A setting that isn't given keeps its
# global value; infrastructure (database, LLM server, keys) can't be changed here. `default` (built in) = the
# global settings. A profile is copied into each job when it's uploaded.
profiles:
  civil-ids:
    id_patterns: config/id_patterns.yaml   # this entity's keywords and ID-number formats (copy and edit the file)
    max_pages: 20
    result_ttl_s: 86400                    # keep results 24 h (instead of RESULT_TTL_S)
  id-check-only:                           # data minimization: only the ID decision leaves (and is kept)
    return_text: false                     # no text in results: pages[].text, fullText, lines, AI reasons
    return_mrz: false                      # no parsed MRZ fields (names, numbers, dates)
    llm_enabled: false                     # decide by rules only: the text never goes to the LLM server
    vision_enabled: false
  archive-text:
    detect_id: false                       # /v1/documents extracts text only
    include_boxes: true                    # line positions by default
    ocr_dpi: 400                           # old, small-print scans

clients:
  civil-registry:                       # id: 1-64 of a-z 0-9 . _ -
    name: "Civil Registry System"
    key_sha256:                         # one hash per valid key; list two while rotating, then remove the old one
      - cdaf86076db4a06b8de440a39fe46045383a425150ac42bd685ce0be1ec79721
      - a4cdc4cd227928863fc467719cdb6ebfe5f789b80525d472cbbb36e1ee9dbe26
    scopes: [documents, extract]        # documents = POST /v1/documents (+ its jobs), extract = POST /v1/extract
    profiles: [civil-ids, id-check-only]   # optional; the first is the default, a request can pick another
    webhook:                            # omit to disable callbacks for this client
      secret_env: WEBHOOK_SECRET_CIVIL_REGISTRY
      allowed_hosts: [hooks.civil-registry.internal]
      retry_window_s: 172800            # optional: retry for 48 h instead of WEBHOOK_RETRY_WINDOW_S
    limits:                             # optional, on top of the global MAX_QUEUED_JOBS / EXTRACT_MAX_CONCURRENT
      max_queued_jobs: 30
      extract_concurrent: 1
    enabled: true                       # false: its keys get 401 and its webhooks stop

  document-archive:
    name: "Document Archive (text only)"
    key_sha256:
      - 6ec66337136300492e735627ad612e07b263d309a7e77031535c5a8bc1195c3b
    scopes: [documents, extract]
    profiles: [archive-text]
