<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>OCR Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/admin/static/css/admin.css">
  <script type="module" src="/admin/static/js/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">OCR</div><div>Admin<small id="env">&nbsp;</small></div></div>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="sidebar-foot">
        <div class="row"><span id="who" class="secondary">&nbsp;</span>
          <button class="btn ghost sm" id="logout" type="button">Log out</button></div>
        <div class="row gap-top">
          <span class="muted" id="version">&nbsp;</span>
          <button class="btn ghost sm" id="theme" type="button" title="Theme">Theme</button>
        </div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1 id="title">Overview</h1>
        <div id="top-controls" class="filters"></div>
        <span class="live-dot" id="live">connecting</span>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
