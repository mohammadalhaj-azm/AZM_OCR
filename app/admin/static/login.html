<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>OCR Admin · Sign in</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/admin/static/css/admin.css">
  <script type="module" src="/admin/static/js/login.js"></script>
</head>
<body>
  <div class="login">
    <form id="form" autocomplete="on">
      <div class="brand flush"><div class="brand-mark">OCR</div><div>Admin dashboard<small>OCR + ID detection platform</small></div></div>
      <label class="field"><span>User name</span><input type="text" name="username" autocomplete="username" required autofocus></label>
      <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
      <div class="err" id="err" role="alert"></div>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
