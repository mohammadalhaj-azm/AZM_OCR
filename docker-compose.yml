# Deployment: service + Ollama. Not needed for local development.
#
#   cp .env.example .env                                   # set API_KEYS, POSTGRES_PASSWORD, RESULT_ENCRYPTION_KEY
#   (the image runs with ENVIRONMENT=production: it refuses to start with placeholder or missing secrets)
#   docker compose --profile setup run --rm ollama-pull    # one-time model download (needs internet)
#   docker compose up -d --build
#   curl http://127.0.0.1:8000/health
#
# Ollama and PostgreSQL sit on an internal-only network: at runtime they have no internet access at all.
name: ocr-id-service

services:
  ollama:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
      # Context window (tokens) of every model Ollama loads. The OpenAI-compatible API can't set it per request and a
      # prompt longer than it is truncated SILENTLY. extract-and-answer needs room for a page chunk plus its
      # corrected copy (ANSWER_CHUNK_CHARS) and for the questions' context (ANSWER_CONTEXT_CHARS). More context =
      # more (V)RAM: check `ollama ps` (CONTEXT, PROCESSOR) after the first requests.
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      - ollama-models:/root/.ollama
    networks: [internal]
    restart: unless-stopped
    # NVIDIA GPU (requires nvidia-container-toolkit on the host): uncomment.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ocr
      POSTGRES_DB: ocr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No statement logging: queries carry (sealed) document data as parameters.
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr -d ocr"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    platform: linux/amd64
    env_file:
      - path: .env
        required: false
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      UPLOAD_DIR: /tmp/ocr-id-service
      JOB_STORE: postgres
      DATABASE_URL: postgresql://ocr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ocr
    # Files in config/ are baked into the image (rebuild after changing them). Server-only files that are not in git go
    # in config/local/ (git-ignored), mounted below and re-read when they change, no rebuild needed. They hold only
    # hashes, no secrets:
    #   admin dashboard (/admin): ADMIN_USERS_FILE=/app/config/local/admins.yaml and ADMIN_SESSION_SECRET in .env
    #   client registry:          CLIENTS_FILE=/app/config/local/clients.yaml and the clients' webhook secrets in .env
    # Keep /admin on an internal network. For the accuracy panel, also mount an eval run folder and set EVAL_OUT_DIR
    # (eval/ is not in the image).
    volumes:
      - ./config/local:/app/config/local:ro
    tmpfs:
      - /tmp:mode=1777  # temp files and UPLOAD_DIR live in RAM only, never on persistent disk
    ports:
      - "127.0.0.1:8000:8000"  # change the host IP to expose it to other machines
    networks: [internal, edge]
    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-time model download. Same volume as `ollama`, but on a network with internet access.
  ollama-pull:
    image: ollama/ollama:0.40.16
    profiles: [setup]
    volumes:
      - ollama-models:/root/.ollama
    networks: [edge]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen3:8b && ollama pull qwen3-vl:8b-instruct"]

networks:
  internal:
    internal: true  # no route to the internet
  edge: {}

volumes:
  ollama-models: {}
  postgres-data: {}
